name: Daily SPY Signal

on:
  # 2026-10-09：每日排程已經搬去 monthly_momentum.yml（有後備時間、檢查當日收市價、防重複），呢度只保留手動執行。
  workflow_dispatch: # 保留手動執行按鈕

jobs:
  spy-signal:
    runs-on: ubuntu-latest

    steps:
      - name: 把房間的東西拿出來 (Checkout repository)
        uses: actions/checkout@v4

      - name: 安裝 Python 大腦
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝小幫手工具
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas numpy

      - name: 計今日SPY訊號並發Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: python -u main.py
