name: Daily Stock AI Agent

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: 把房間的東西拿出來
        uses: actions/checkout@v3

      - name: 安裝 Python 大腦
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝小幫手工具
        run: pip install requests google-genai finvizfinance pandas lxml yfinance

      - name: 執行魔法腳本！
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: python main.py
