name: Daily SPY Signal

on:
  schedule:
    # 星期一至五 UTC 21:30 = 美股收市後（夏令時間 17:30 ET；冬令時間 16:30 ET），全年都係收市後先跑
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # 保留手動執行按鈕

jobs:
  spy-signal:
    runs-on: ubuntu-latest

    steps:
      - name: 把房間的東西拿出來 (Checkout repository)
        uses: actions/checkout@v4

      - name: 安裝 Python 大腦
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝小幫手工具
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas numpy

      - name: 計今日SPY訊號並發Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: python -u main.py
