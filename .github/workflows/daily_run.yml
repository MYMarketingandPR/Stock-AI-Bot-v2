name: Daily Stock AI Agent 
on:
  schedule:
    # 星期一至五，每日 UTC 14:00 (開市後 30 分鐘)
    - cron: '0 14 * * 1-5'
    # 星期一至五，每日 UTC 20:30 (收市後 30 分鐘)
    - cron: '30 20 * * 1-5'
  workflow_dispatch: # 保留手動執行按鈕

jobs:
  run-agent-v4:
    runs-on: ubuntu-latest
    
    steps:
      - name: 把房間的東西拿出來 (Checkout repository)
        uses: actions/checkout@v4
        
      - name: 安裝 Python 大腦
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安裝小幫手工具 (包含 pandas 與 yfinance)
        run: |
          python -m pip install --upgrade pip
          pip install requests finvizfinance groq yfinance pandas
          
      - name: 執行 V4 雙軌魔法腳本！
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        # 這裡加上了 -u，讓 Log 可以即時顯示無緩衝
        run: python -u main.py
