name: Daily Stock AI Agent V4 (Dual Track)

on:
  schedule:
    # 美股收市後一小時先run（同main.py錢開，刻意同main.py錢開分開時段，避免兩個bot撞埋一齊出訊號）
    # 收市16:00 ET，+1小時=17:00 ET。假設夏令時間(EDT, UTC-4) → 21:00 UTC
    # ⚠️ 冬令時間(EST, UTC-5)會變咗17:00 ET其實係22:00 UTC，但cron寫住固定UTC時間，
    #    所以每年11月至3月初（美國冬令時間）實際會early咗一個鐘(即ET 16:00先run,收市後即刻run)。
    #    如果想全年都精準跟到「收市後一小時」，需要人手跟美國DST轉換日期改呢行cron,或者用第三方排程服務。
    - cron: '0 21 * * 1-5'

  # 允許手動點擊按鈕執行
  workflow_dispatch:

jobs:
  run-agent-v4:
    runs-on: ubuntu-latest
    
    steps:
      - name: 把房間的東西拿出來 (Checkout repository)
        uses: actions/checkout@v4
        
      - name: 安裝 Python 大腦
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安裝小幫手工具 (包含 pandas 與 yfinance)
        run: |
          python -m pip install --upgrade pip
          pip install requests finvizfinance groq yfinance pandas
          
      - name: 執行 V4 雙軌魔法腳本！
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: python -u main_v4.py
