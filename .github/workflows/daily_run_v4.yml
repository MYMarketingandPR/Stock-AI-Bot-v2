name: Daily Stock AI Agent V4 (Dual Track)

on:
  # 2026-10-15：已停用自動排程（Esther 2026-10-09 要求暫停 main_v4.py 推送；搬去 Stock-AI-Bot-v2 時移除）

  # 允許手動點擊按鈕執行
  workflow_dispatch:

jobs:
  run-agent-v4:
    runs-on: ubuntu-latest
    
    steps:
      - name: 把房間的東西拿出來 (Checkout repository)
        uses: actions/checkout@v4
        
      - name: 安裝 Python 大腦
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安裝小幫手工具 (包含 pandas 與 yfinance)
        run: |
          python -m pip install --upgrade pip
          pip install requests finvizfinance groq yfinance pandas
          
      - name: 執行 V4 雙軌魔法腳本！
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: python -u main_v4.py
