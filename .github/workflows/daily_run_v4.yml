name: Daily Stock AI Agent V4 (Dual Track)

on:
  schedule:
    # 每天一到五執行。這裡設定的分鐘數請依你的舊版稍作錯開。
    # 例如舊版是 '0 13 * * 1-5'，這裡可以設為 '30 13 * * 1-5' (錯開半小時)
    - cron: '30 13 * * 1-5'
  
  # 允許手動點擊按鈕執行
  workflow_dispatch:

jobs:
  run-agent-v4:
    runs-on: ubuntu-latest
    
    steps:
      - name: 把房間的東西拿出來 (Checkout repository)
        uses: actions/checkout@v4
        
      - name: 安裝 Python 大腦
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安裝小幫手工具 (包含 pandas 與 yfinance)
        run: |
          python -m pip install --upgrade pip
          pip install requests finvizfinance groq yfinance pandas
          
      - name: 執行 V4 雙軌魔法腳本！
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: python main_v4.py
