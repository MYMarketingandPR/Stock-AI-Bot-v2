name: etf_rotation

# 板塊ETF輪動 + SPY槓桿研究（設計預先登記喺etf_rotation.py）
on:
  workflow_dispatch:

jobs:
  run-etf:
    runs-on: ubuntu-latest
    steps:
      - name: 把房間的野拿出黎
        uses: actions/checkout@v4

      - name: 安裝 Python 大腦
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安裝小幫手工具
        run: pip install yfinance pandas numpy

      - name: 跑ETF輪動同槓桿研究
        run: python -u etf_rotation.py

      - name: 上傳結果
        uses: actions/upload-artifact@v4
        with:
          name: etf-results
          path: |
            etf_results.csv
            etf_grid.csv
            etf_equity.csv
