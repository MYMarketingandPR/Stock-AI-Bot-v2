name: Monthly Momentum (paper trading)

on:
  schedule:
    # 星期一至五 UTC 21:45（美股收市後）；程式自己判斷係咪換倉日 / 月尾（月尾仲會出每月成績表）
    # 後備：UTC 00:30、03:15（2026-10-08 加：Yahoo 有時收市後幾個鐘仲未有部分股票當日收市價；做咗就唔會再做）
    - cron: '45 21 * * 1-5'
    - cron: '30 0 * * 2-6'
    - cron: '15 3 * * 2-6'
  workflow_dispatch:
    inputs:
      force:
        description: "唔理係咪換倉日，即刻換倉（yes/no）"
        required: false
        default: "no"
      tracks:
        description: "只換邊幾條線（例如 C 或 A,B）；留空 = 全部"
        required: false
        default: ""
      scoreboard:
        description: "出每月成績表（yes = 換倉/每日報告之後再出；only = 只出成績表）"
        required: false
        default: "no"
      sheetonly:
        description: "只寫 Google Sheet（yes）：唔發Telegram、唔換倉、唔交易，用最近一個交易日"
        required: false
        default: "no"
      date:
        description: "配合 sheetonly：用邊一日（YYYY-MM-DD，留空 = 今日或最近交易日）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  momentum:
    runs-on: ubuntu-latest
    steps:
      - name: 把房間的東西拿出來
        uses: actions/checkout@v4

      - name: 安裝 Python 大腦
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝小幫手工具
        run: pip install requests yfinance pandas numpy lxml

      - name: 攞返之前嘅模擬交易紀錄
        run: |
          git fetch origin paper-trading && git checkout origin/paper-trading -- paper_log || echo "未有紀錄"

      - name: SPY每日訊號（main.py；2026-10-09 由 daily_run 搬過嚟，有後備時間同防重複）
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python -u main.py --scheduled; else echo "手動執行：唔發SPY訊號"; fi

      - name: 計每月動量
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          PAPER_CAPITAL: "80000"
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--scheduled"; fi
          if [ "${{ inputs.force }}" = "yes" ]; then ARGS="--force"; fi
          if [ -n "${{ inputs.tracks }}" ]; then ARGS="$ARGS --tracks=${{ inputs.tracks }}"; fi
          if [ "${{ inputs.scoreboard }}" = "yes" ]; then ARGS="$ARGS --scoreboard"; fi
          if [ "${{ inputs.scoreboard }}" = "only" ]; then ARGS="$ARGS --scoreboard-only"; fi
          if [ "${{ inputs.sheetonly }}" = "yes" ]; then ARGS="--sheet-only --date=${{ inputs.date }}"; fi
          python -u momentum_monthly.py $ARGS

      - name: 線D（倍升股 + 由高位跌20%賣）
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          PAPER_CAPITAL: "80000"
        run: |
          if [ "${{ inputs.sheetonly }}" = "yes" ]; then python -u line_d.py --sheet-only; else python -u line_d.py; fi

      - name: 線D2（線D + SPY訊號持有先開新倉）
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          PAPER_CAPITAL: "80000"
        run: |
          if [ "${{ inputs.sheetonly }}" = "yes" ]; then python -u line_d.py --variant=D2 --sheet-only; else python -u line_d.py --variant=D2; fi

      - name: 線E（今年升≥30% + 離高位<30% + 喺MA200上面）
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          PAPER_CAPITAL: "80000"
        run: |
          if [ "${{ inputs.sheetonly }}" = "yes" ]; then python -u line_d.py --variant=E --sheet-only; else python -u line_d.py --variant=E; fi

      - name: 線E2（線E + 行業轉弱唔開新倉，2026-10-15 開始觀察）
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          PAPER_CAPITAL: "80000"
        run: |
          if [ "${{ inputs.sheetonly }}" = "yes" ]; then python -u line_d.py --variant=E2 --sheet-only; else python -u line_d.py --variant=E2; fi

      - name: 線E3（線E + SPY訊號持有先開新倉，2026-10-15 開始觀察）
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          PAPER_CAPITAL: "80000"
        run: |
          if [ "${{ inputs.sheetonly }}" = "yes" ]; then python -u line_d.py --variant=E3 --sheet-only; else python -u line_d.py --variant=E3; fi

      - name: 月尾記低分析師EPS預測（自己儲歷史數據，第十四輪）
        continue-on-error: true
        run: |
          if [ "${{ inputs.sheetonly }}" != "yes" ]; then python -u snapshot_estimates.py; fi

      - name: 將紀錄放去 paper-trading 分支
        run: |
          if [ ! -d paper_log ]; then echo "今日冇紀錄"; exit 0; fi
          mkdir -p /tmp/log && cp paper_log/* /tmp/log/ && rm -rf paper_log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git fetch origin paper-trading; then
            git checkout -B paper-trading origin/paper-trading
          else
            git checkout --orphan paper-trading
            git rm -rf . > /dev/null
          fi
          mkdir -p paper_log && cp /tmp/log/* paper_log/
          git add paper_log
          git commit -m "paper trading log (run ${{ github.run_id }})" || echo "冇改變"
          git push origin paper-trading
