name: Monthly Momentum (paper trading)

on:
  schedule:
    # 星期一至五 UTC 21:45（美股收市後）；程式自己判斷係咪換倉日 / 月尾（月尾仲會出每月成績表）
    - cron: '45 21 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: "唔理係咪換倉日，即刻換倉（yes/no）"
        required: false
        default: "no"
      tracks:
        description: "只換邊幾條線（例如 C 或 A,B）；留空 = 全部"
        required: false
        default: ""
      scoreboard:
        description: "出每月成績表（yes = 換倉/每日報告之後再出；only = 只出成績表）"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  momentum:
    runs-on: ubuntu-latest
    steps:
      - name: 把房間的東西拿出來
        uses: actions/checkout@v4

      - name: 安裝 Python 大腦
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝小幫手工具
        run: pip install requests yfinance pandas numpy lxml

      - name: 攞返之前嘅模擬交易紀錄
        run: |
          git fetch origin paper-trading && git checkout origin/paper-trading -- paper_log || echo "未有紀錄"

      - name: 計每月動量
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          PAPER_CAPITAL: "80000"
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "yes" ]; then ARGS="--force"; fi
          if [ -n "${{ inputs.tracks }}" ]; then ARGS="$ARGS --tracks=${{ inputs.tracks }}"; fi
          if [ "${{ inputs.scoreboard }}" = "yes" ]; then ARGS="$ARGS --scoreboard"; fi
          if [ "${{ inputs.scoreboard }}" = "only" ]; then ARGS="$ARGS --scoreboard-only"; fi
          python -u momentum_monthly.py $ARGS

      - name: 線D（倍升股 + 由高位跌20%賣）
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          PAPER_CAPITAL: "80000"
        run: python -u line_d.py

      - name: 月尾記低分析師EPS預測（自己儲歷史數據，第十四輪）
        continue-on-error: true
        run: python -u snapshot_estimates.py

      - name: 將紀錄放去 paper-trading 分支
        run: |
          if [ ! -d paper_log ]; then echo "今日冇紀錄"; exit 0; fi
          mkdir -p /tmp/log && cp paper_log/* /tmp/log/ && rm -rf paper_log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git fetch origin paper-trading; then
            git checkout -B paper-trading origin/paper-trading
          else
            git checkout --orphan paper-trading
            git rm -rf . > /dev/null
          fi
          mkdir -p paper_log && cp /tmp/log/* paper_log/
          git add paper_log
          git commit -m "paper trading log (run ${{ github.run_id }})" || echo "冇改變"
          git push origin paper-trading
