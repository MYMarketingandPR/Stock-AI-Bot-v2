name: research_gmma

# 驗證「GMMA向上 + 高度重合」規律（設計預先登記喺research_gmma.py）
on:
  workflow_dispatch:

jobs:
  run-gmma:
    runs-on: ubuntu-latest
    steps:
      - name: 把房間的野拿出黎
        uses: actions/checkout@v4

      - name: 安裝 Python 大腦
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安裝小幫手工具
        run: pip install yfinance pandas numpy

      - name: 跑GMMA驗證
        run: python -u research_gmma.py

      - name: 上傳結果
        uses: actions/upload-artifact@v4
        with:
          name: gmma-results
          path: |
            gmma_results.csv
            gmma_samples.csv.gz
