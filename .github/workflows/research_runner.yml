name: research_runner

# 通用研究執行器：跑指定嘅Python研究程式，將輸出CSV放去 research-results 分支
on:
  workflow_dispatch:
    inputs:
      script:
        description: "要跑嘅程式，例如 spy_bottoms_v2_check.py"
        required: true
      outputs:
        description: "輸出檔案（用空格分開）"
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 把房間的野拿出黎
        uses: actions/checkout@v4

      - name: 安裝 Python 大腦
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安裝小幫手工具
        run: pip install yfinance pandas numpy lxml requests

      - name: 跑研究
        run: python -u "${{ inputs.script }}"

      - name: 上傳結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-output
          path: ${{ inputs.outputs }}

      - name: 將結果放去 research-results 分支
        if: always()
        run: |
          mkdir -p /tmp/out && cp ${{ inputs.outputs }} /tmp/out/ || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin research-results
          git checkout -B research-results origin/research-results
          cp /tmp/out/* .
          for f in ${{ inputs.outputs }}; do [ -f "$f" ] && git add "$f"; done
          git commit -m "${{ inputs.script }} results (run ${{ github.run_id }})" || echo "冇改變"
          for i in 1 2 3; do git push origin research-results && break; git pull --rebase origin research-results; done
